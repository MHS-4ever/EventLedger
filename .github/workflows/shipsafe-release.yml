name: ShipSafe release
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [bootstrap, deploy, status, rollback]
        required: true
        default: bootstrap
      release_id:
        description: Optional verified rollback release ID
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: shipsafe-production
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main' && github.repository == 'MHS-4ever/EventLedger' && (inputs.operation == 'bootstrap' || inputs.operation == 'deploy')
    uses: ./.github/workflows/shipsafe-ci.yml
  publish:
    needs: checks
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && github.repository == 'MHS-4ever/EventLedger' && (needs.checks.result == 'success' || ((inputs.operation == 'status' || inputs.operation == 'rollback') && needs.checks.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    # Do not add a GitHub Environment: it would change the approved OIDC subject.
    env:
      AWS_REGION: us-east-1
      SHIPSAFE_INSTANCE_ID: ${{ vars.SHIPSAFE_INSTANCE_ID }}
      SHIPSAFE_DOMAIN: ${{ vars.SHIPSAFE_DOMAIN }}
      SHIPSAFE_PUBLIC_IP: ${{ vars.SHIPSAFE_PUBLIC_IP }}
      RELEASE_OPERATION: ${{ inputs.operation }}
      ROLLBACK_RELEASE_ID: ${{ inputs.release_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require deployment decisions
        shell: bash
        run: |
          test -n "$SHIPSAFE_INSTANCE_ID"
          test -n "$SHIPSAFE_DOMAIN"
          test -n "$SHIPSAFE_PUBLIC_IP"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.SHIPSAFE_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com
          allowed-account-ids: '542468167362'
          role-duration-seconds: 3600
          role-session-name: shipsafe-${{ github.run_id }}
      - name: Publish immutable release or operate verified release
        run: python -m shipsafe.publisher --execute --operation "$RELEASE_OPERATION" --release-id "$ROLLBACK_RELEASE_ID"
      - name: Clear runner registry credentials
        if: always()
        run: docker logout 542468167362.dkr.ecr.us-east-1.amazonaws.com || true
