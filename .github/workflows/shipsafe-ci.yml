name: ShipSafe CI
on:
  pull_request:
  push:
    branches: [main, feature/shipsafe]
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false
      - name: Install test dependencies
        run: python -m pip install '.[dev]'
      - name: Initialize offline providers and validate Terraform
        run: |
          terraform -chdir=shipsafe/infra/main init -backend=false -input=false
          terraform fmt -check shipsafe/infra/main
          terraform -chdir=shipsafe/infra/main validate
      - name: Offline tests and Python syntax
        run: |
          python -m compileall -q app shipsafe scripts
          python -m pytest -q -m 'not pg_integration'
      - name: Configure isolated synthetic test environments
        run: python -m shipsafe.ci_config
      - name: Production Compose and Caddy configuration validation
        run: python -m shipsafe.check_production
      - name: Isolated PostgreSQL integration tests
        env:
          EVENTLEDGER_RUN_PG_INTEGRATION: '1'
        run: |
          docker compose --env-file .env.test -f compose.test.yaml up -d --wait
          python -m scripts.prepare_test_db
          python -m pytest -q -m pg_integration
      - name: Local container bootstrap, promotion, worker and rollback acceptance
        run: python -m shipsafe.acceptance --runtime-env shipsafe/runtime/ci.env --runtime-dir shipsafe/runtime/ci-acceptance
      - name: Stop isolated test database
        if: always()
        run: docker compose --env-file .env.test -f compose.test.yaml down --volumes || true
