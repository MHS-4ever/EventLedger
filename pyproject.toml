[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eventledger"
version = "0.1.0"
description = "A reliable webhook and event-processing backend."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20,<2.0",
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0,<3.0",
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
exclude = ["migrations", "migrations.*", "tests", "tests.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pg_integration: opt-in tests requiring the isolated PostgreSQL test database",
]

