x-app-image: &app-image
  image: eventledger:day3-delivery
  build:
    context: .
    dockerfile: Dockerfile

x-app-environment: &app-environment
  POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
  POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  EVENTLEDGER_API_KEY: "${EVENTLEDGER_API_KEY:?EVENTLEDGER_API_KEY is required}"
  EVENTLEDGER_SOURCE_ID: "${EVENTLEDGER_SOURCE_ID:?EVENTLEDGER_SOURCE_ID is required}"
  WORKER_POLL_INTERVAL_SECONDS: "${WORKER_POLL_INTERVAL_SECONDS:-1}"
  WORKER_LEASE_DURATION_SECONDS: "${WORKER_LEASE_DURATION_SECONDS:-30}"
  WORKER_MAX_ATTEMPTS: "${WORKER_MAX_ATTEMPTS:-3}"
  WORKER_RETRY_BASE_SECONDS: "${WORKER_RETRY_BASE_SECONDS:-2}"
  WORKER_RETRY_MAX_SECONDS: "${WORKER_RETRY_MAX_SECONDS:-60}"
  WORKER_FAILURE_SIMULATION_ENABLED: "false"
  WORKER_SIMULATION_MAX_SLOW_SECONDS: "${WORKER_SIMULATION_MAX_SLOW_SECONDS:-30}"

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - postgres_delivery_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    <<: *app-image
    restart: "no"
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "alembic", "upgrade", "head"]

  api:
    <<: *app-image
    restart: unless-stopped
    init: true
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  worker:
    <<: *app-image
    restart: unless-stopped
    init: true
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.worker", "--log-level", "INFO"]
    stop_grace_period: 35s

volumes:
  postgres_delivery_data:
